<svg viewBox="0 0 1100 550" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1100" height="550" fill="#fafafa"/>

  <text x="550" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">
    FSM de vload_vstore_engine.sv — vload / vstore
  </text>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#666">
    logic [1:0] state — 3 estados. Mismo camino para vload y vstore (solo cambia is_store_latched)
  </text>

  <!-- IDLE -->
  <ellipse cx="150" cy="280" rx="100" ry="60" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="150" y="273" text-anchor="middle" font-size="15" font-weight="bold">IDLE</text>
  <text x="150" y="292" text-anchor="middle" font-size="10" fill="#666">busy=0</text>

  <!-- RUN -->
  <rect x="380" y="150" width="380" height="260" fill="#fff" stroke="#333" stroke-width="2" rx="14"/>
  <text x="570" y="180" text-anchor="middle" font-size="16" font-weight="bold">RUN</text>
  <text x="570" y="198" text-anchor="middle" font-size="10" fill="#666">idx: 0..255 (1 coeficiente/ciclo)</text>

  <rect x="410" y="220" width="320" height="80" fill="#e3f2fd" stroke="#1565c0" rx="6"/>
  <text x="570" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d3d78">vload (is_store_latched=0)</text>
  <text x="570" y="260" text-anchor="middle" font-size="9" fill="#0d3d78">dmem_mem_read=1 (funct3=101, lhu)</text>
  <text x="570" y="275" text-anchor="middle" font-size="9" fill="#0d3d78">vreg_we1=1, vreg_wdata1=dmem_rdata[15:0]</text>
  <text x="570" y="290" text-anchor="middle" font-size="9" fill="#0d3d78">coef_addr = addr_base + 2·idx</text>

  <rect x="410" y="315" width="320" height="80" fill="#fff3e0" stroke="#e65100" rx="6"/>
  <text x="570" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#c9500a">vstore (is_store_latched=1)</text>
  <text x="570" y="355" text-anchor="middle" font-size="9" fill="#c9500a">dmem_mem_write=1 (funct3=001, sh)</text>
  <text x="570" y="370" text-anchor="middle" font-size="9" fill="#c9500a">dmem_wdata = vreg_rdata1</text>
  <text x="570" y="385" text-anchor="middle" font-size="9" fill="#c9500a">.vreg = vreg_rd (¡corregido, Hallazgo #4!)</text>

  <!-- DONE_PULSE -->
  <ellipse cx="950" cy="280" rx="110" ry="60" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="950" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">DONE_PULSE</text>
  <text x="950" y="292" text-anchor="middle" font-size="9" fill="#1b5e20">done=1 (1 ciclo), busy=0</text>

  <!-- Transitions -->
  <path d="M 250 280 L 380 280" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="315" y="270" text-anchor="middle" font-size="10">start</text>
  <text x="315" y="300" text-anchor="middle" font-size="8" fill="#666">(latch is_store/vreg/addr)</text>

  <path d="M 570 130 C 570 100, 620 100, 650 130" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a4)"/>
  <ellipse cx="610" cy="115" rx="65" ry="18" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="610" y="119" text-anchor="middle" font-size="9">idx≠255 → idx++</text>

  <path d="M 760 280 L 840 280" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="800" y="270" text-anchor="middle" font-size="10">idx==255</text>

  <path d="M 900 340 C 700 480, 300 480, 165 340" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="530" y="475" text-anchor="middle" font-size="10">siempre (1 ciclo)</text>

  <!-- Bottom note -->
  <rect x="60" y="440" width="980" height="80" fill="#fffde7" stroke="#b8860b" stroke-width="1.2" rx="6"/>
  <text x="550" y="463" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5c00">
    Duración total: 257 ciclos (1 de IDLE→RUN + 256 de RUN + 1 de DONE_PULSE, aprox.)
  </text>
  <text x="550" y="482" text-anchor="middle" font-size="10" fill="#333">
    El scoreboard (v0-v3) protege el registro vectorial mientras esta FSM corre, pero NO protege la memoria de
  </text>
  <text x="550" y="499" text-anchor="middle" font-size="10" fill="#333">
    destino/origen — código escalar que lee esa memoria antes de DONE_PULSE puede ver datos incompletos (Hallazgo #3).
  </text>
</svg>

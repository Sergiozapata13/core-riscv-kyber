<svg viewBox="0 0 1700 1000" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrow_ctrl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b8860b"/>
    </marker>
    <marker id="arrow_fwd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1700" height="1000" fill="#fafafa"/>

  <text x="850" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">
    core_top_pipelined.sv — Datapath de 5 etapas + Unidad Vectorial (Fase 4)
  </text>
  <text x="850" y="58" text-anchor="middle" font-size="13" fill="#666">
    Core RISC-V con Aceleración Vectorial para Kyber/ML-KEM
  </text>

  <!-- ================= ETAPA IF ================= -->
  <rect x="20" y="90" width="240" height="860" fill="#e8f0fe" stroke="#4472c4" stroke-width="1.5" rx="6"/>
  <text x="140" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3d7c">IF</text>

  <rect x="55" y="140" width="170" height="60" fill="#fff" stroke="#4472c4" stroke-width="1.5" rx="4"/>
  <text x="140" y="165" text-anchor="middle" font-size="13" font-weight="bold">PC</text>
  <text x="140" y="182" text-anchor="middle" font-size="10" fill="#555">pc_next / pc_stall</text>

  <rect x="55" y="230" width="170" height="70" fill="#fff" stroke="#4472c4" stroke-width="1.5" rx="4"/>
  <text x="140" y="255" text-anchor="middle" font-size="13" font-weight="bold">imem.sv</text>
  <text x="140" y="273" text-anchor="middle" font-size="10" fill="#555">INIT_FILE (.hex)</text>
  <text x="140" y="288" text-anchor="middle" font-size="10" fill="#555">1 puerto lectura</text>

  <line x1="140" y1="200" x2="140" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- IF/ID reg -->
  <rect x="55" y="330" width="170" height="580" fill="#fff8e1" stroke="#b8860b" stroke-width="1.2" rx="4"/>
  <text x="140" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c00">if_id_reg</text>
  <text x="140" y="368" text-anchor="middle" font-size="9" fill="#7a5c00">valid + instr + pc</text>
  <text x="140" y="620" text-anchor="middle" font-size="9" fill="#7a5c00" transform="rotate(-90 140 620)">stall / flush (control)</text>

  <line x1="140" y1="300" x2="140" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= ETAPA ID ================= -->
  <rect x="270" y="90" width="330" height="860" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5" rx="6"/>
  <text x="435" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">ID</text>

  <rect x="300" y="140" width="270" height="60" fill="#fff" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
  <text x="435" y="165" text-anchor="middle" font-size="13" font-weight="bold">control.sv</text>
  <text x="435" y="182" text-anchor="middle" font-size="10" fill="#555">decodifica opcode/funct3/funct7</text>

  <rect x="300" y="215" width="270" height="70" fill="#fff" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
  <text x="435" y="240" text-anchor="middle" font-size="13" font-weight="bold">regfile.sv</text>
  <text x="435" y="258" text-anchor="middle" font-size="10" fill="#555">32×32b · ENABLE_BYPASS=1</text>
  <text x="435" y="273" text-anchor="middle" font-size="10" fill="#555">2 lecturas + 1 escritura (WB)</text>

  <rect x="300" y="300" width="270" height="55" fill="#fff" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
  <text x="435" y="323" text-anchor="middle" font-size="13" font-weight="bold">imm_gen.sv</text>
  <text x="435" y="340" text-anchor="middle" font-size="10" fill="#555">ensambla inmediato por tipo</text>

  <rect x="300" y="370" width="270" height="55" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="4"/>
  <text x="435" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#c9500a">hazard_detection_unit</text>
  <text x="435" y="410" text-anchor="middle" font-size="10" fill="#7a3b0a">load-use → pc_stall / if_id_stall</text>

  <path d="M 300 397 C 240 397, 140 397, 140 200" fill="none" stroke="#c9500a" stroke-width="1.3" marker-end="url(#arrow_ctrl)"/>
  <text x="200" y="415" font-size="9" fill="#c9500a">pc_stall / if_id_stall</text>

  <!-- ID/EX reg -->
  <rect x="600" y="330" width="170" height="580" fill="#fff8e1" stroke="#b8860b" stroke-width="1.2" rx="4"/>
  <text x="685" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c00">id_ex_reg</text>
  <text x="685" y="368" text-anchor="middle" font-size="9" fill="#7a5c00">datos + rs1/rs2 + ctrl</text>
  <text x="685" y="620" text-anchor="middle" font-size="9" fill="#7a5c00" transform="rotate(-90 685 620)">stall(vector_stall) / flush</text>

  <line x1="570" y1="255" x2="685" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= ETAPA EX ================= -->
  <rect x="800" y="90" width="480" height="860" fill="#fdeaea" stroke="#c62828" stroke-width="1.5" rx="6"/>
  <text x="1040" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#8e1c1c">EX</text>

  <rect x="830" y="140" width="200" height="60" fill="#fff" stroke="#c62828" stroke-width="1.5" rx="4"/>
  <text x="930" y="165" text-anchor="middle" font-size="13" font-weight="bold">alu.sv</text>
  <text x="930" y="182" text-anchor="middle" font-size="10" fill="#555">ADD/SUB/lógicas/shifts/cmp</text>

  <rect x="1050" y="140" width="200" height="60" fill="#fff" stroke="#c62828" stroke-width="1.5" rx="4"/>
  <text x="1150" y="165" text-anchor="middle" font-size="13" font-weight="bold">branch_unit.sv</text>
  <text x="1150" y="182" text-anchor="middle" font-size="10" fill="#555">resuelve branch/jump aquí</text>

  <rect x="830" y="215" width="200" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="4"/>
  <text x="930" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d3d78">forwarding_unit</text>
  <text x="930" y="255" text-anchor="middle" font-size="10" fill="#0d3d78">EX/MEM ≻ MEM/WB → alu opA/opB</text>

  <!-- Vector block -->
  <rect x="830" y="290" width="420" height="490" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.8" rx="6"/>
  <text x="1040" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a0e6b">Unidad Vectorial (Fase 4)</text>

  <rect x="855" y="330" width="180" height="60" fill="#fff" stroke="#6a1b9a" stroke-width="1.4" rx="4"/>
  <text x="945" y="353" text-anchor="middle" font-size="12" font-weight="bold">vector_control.sv</text>
  <text x="945" y="370" text-anchor="middle" font-size="9" fill="#555">decodifica custom-0, vive en EX</text>

  <rect x="1055" y="330" width="180" height="60" fill="#fff" stroke="#6a1b9a" stroke-width="1.4" rx="4"/>
  <text x="1145" y="353" text-anchor="middle" font-size="12" font-weight="bold">vector_scoreboard</text>
  <text x="1145" y="370" text-anchor="middle" font-size="9" fill="#555">4 bits, v0-v3 ocupado/libre</text>

  <rect x="855" y="415" width="380" height="330" fill="#fff" stroke="#6a1b9a" stroke-width="1.4" rx="4"/>
  <text x="1045" y="438" text-anchor="middle" font-size="12" font-weight="bold">vector_unit.sv</text>
  <text x="1045" y="453" text-anchor="middle" font-size="9" fill="#555">recurso único · 5 motores + vreg_file + twiddle_rom</text>

  <rect x="875" y="470" width="105" height="45" fill="#f8f0fb" stroke="#6a1b9a" rx="3"/>
  <text x="927" y="490" text-anchor="middle" font-size="10">ntt_engine</text>
  <text x="927" y="503" text-anchor="middle" font-size="8" fill="#666">vntt/vintt</text>

  <rect x="990" y="470" width="105" height="45" fill="#f8f0fb" stroke="#6a1b9a" rx="3"/>
  <text x="1042" y="490" text-anchor="middle" font-size="10">vpmul_engine</text>
  <text x="1042" y="503" text-anchor="middle" font-size="8" fill="#666">base_case_mul</text>

  <rect x="1105" y="470" width="105" height="45" fill="#f8f0fb" stroke="#6a1b9a" rx="3"/>
  <text x="1157" y="490" text-anchor="middle" font-size="10">addsub_engine</text>
  <text x="1157" y="503" text-anchor="middle" font-size="8" fill="#666">vadd/vsub</text>

  <rect x="875" y="525" width="105" height="45" fill="#f8f0fb" stroke="#6a1b9a" rx="3"/>
  <text x="927" y="545" text-anchor="middle" font-size="10">barrett_engine</text>
  <text x="927" y="558" text-anchor="middle" font-size="8" fill="#666">vbarrett</text>

  <rect x="990" y="525" width="105" height="45" fill="#f8f0fb" stroke="#6a1b9a" rx="3"/>
  <text x="1042" y="545" text-anchor="middle" font-size="10">vload_vstore</text>
  <text x="1042" y="558" text-anchor="middle" font-size="8" fill="#666">_engine</text>

  <rect x="1105" y="525" width="105" height="45" fill="#e8f5e9" stroke="#2e7d32" rx="3"/>
  <text x="1157" y="545" text-anchor="middle" font-size="9" font-weight="bold">recurso único</text>
  <text x="1157" y="558" text-anchor="middle" font-size="8" fill="#666">any_busy (OR)</text>

  <rect x="905" y="590" width="140" height="50" fill="#fff" stroke="#6a1b9a" stroke-dasharray="3,2" rx="3"/>
  <text x="975" y="611" text-anchor="middle" font-size="10" font-weight="bold">vreg_file</text>
  <text x="975" y="626" text-anchor="middle" font-size="8" fill="#666">v0-v3, 128×32b c/u</text>

  <rect x="1055" y="590" width="140" height="50" fill="#fff" stroke="#6a1b9a" stroke-dasharray="3,2" rx="3"/>
  <text x="1125" y="611" text-anchor="middle" font-size="10" font-weight="bold">twiddle_rom</text>
  <text x="1125" y="626" text-anchor="middle" font-size="8" fill="#666">128 ζ (compartida)</text>

  <text x="1045" y="665" text-anchor="middle" font-size="9" fill="#4a0e6b" font-style="italic">
    mux compartido: solo 1 motor activo a la vez (A.4)
  </text>

  <line x1="1030" y1="200" x2="1030" y2="215" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="770" y1="500" x2="830" y2="500" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- EX/MEM reg -->
  <rect x="1300" y="330" width="170" height="580" fill="#fff8e1" stroke="#b8860b" stroke-width="1.2" rx="4"/>
  <text x="1385" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c00">ex_mem_reg</text>
  <text x="1385" y="368" text-anchor="middle" font-size="9" fill="#7a5c00">alu_result + mem ctrl</text>
  <text x="1385" y="620" text-anchor="middle" font-size="9" fill="#7a5c00" transform="rotate(-90 1385 620)">flush(vector_stall)</text>

  <line x1="1250" y1="170" x2="1385" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= ETAPA MEM ================= -->
  <rect x="1500" y="90" width="180" height="860" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5" rx="6"/>
  <text x="1590" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#311b92">MEM</text>

  <rect x="1520" y="330" width="140" height="90" fill="#fff" stroke="#4527a0" stroke-width="1.5" rx="4"/>
  <text x="1590" y="355" text-anchor="middle" font-size="12" font-weight="bold">dmem.sv</text>
  <text x="1590" y="372" text-anchor="middle" font-size="9" fill="#555">2 puertos (Fase 4)</text>
  <text x="1590" y="387" text-anchor="middle" font-size="9" fill="#555">P1: escalar · P2: vector</text>
  <text x="1590" y="402" text-anchor="middle" font-size="9" fill="#555">INIT_FILE compartido con imem</text>

  <line x1="1470" y1="500" x2="1590" y2="420" stroke="#6a1b9a" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="1500" y="470" font-size="8" fill="#6a1b9a">puerto 2</text>

  <line x1="1470" y1="500" x2="1520" y2="375" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- MEM/WB reg -->
  <rect x="1520" y="440" width="140" height="45" fill="#fff8e1" stroke="#b8860b" stroke-width="1.2" rx="4"/>
  <text x="1590" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5c00">mem_wb_reg</text>
  <text x="1590" y="475" text-anchor="middle" font-size="8" fill="#7a5c00">wb_data + reg_write</text>
  <line x1="1590" y1="420" x2="1590" y2="440" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Forwarding paths (drawn as curved dashed blue lines back to EX) -->
  <path d="M 1385 400 C 1250 250, 1000 250, 930 215" fill="none" stroke="#1565c0" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow_fwd)"/>
  <text x="1180" y="245" font-size="9" fill="#1565c0">forward EX/MEM → EX</text>

  <!-- WB back to regfile -->
  <path d="M 1590 485 C 1590 900, 435 900, 435 285" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="900" y="915" text-anchor="middle" font-size="10" fill="#333">WB: wb_data → regfile (escritura, mismo ciclo lectura ID vía bypass)</text>

  <!-- Legend -->
  <rect x="20" y="960" width="16" height="10" fill="#333"/>
  <text x="42" y="969" font-size="10">flujo de instrucción / datos</text>
  <rect x="260" y="960" width="16" height="10" fill="#1565c0"/>
  <text x="282" y="969" font-size="10">forwarding (datos)</text>
  <rect x="440" y="960" width="16" height="10" fill="#b8860b"/>
  <text x="462" y="969" font-size="10">registros de segmentación (stall/flush)</text>
  <rect x="750" y="960" width="16" height="10" fill="#6a1b9a"/>
  <text x="772" y="969" font-size="10">unidad vectorial (Fase 4)</text>
</svg>
